services:
  # 1. MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql_local
    environment:
      - MYSQL_DATABASE=financiero
      - MYSQL_USER=postgres
      - MYSQL_PASSWORD=supersecretpassword123
      - MYSQL_ROOT_PASSWORD=supersecretrootpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./fincoah_2026_07_18.sql:/docker-entrypoint-initdb.d/fincoah_2026_07_18.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psupersecretrootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Service Python Data Science
  data-science:
    build:
      context: ../data-science/research/fincoach-mvp/back
      dockerfile: Dockerfile
    container_name: python-data-science
    hostname: python-data-science
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ENV=local
      - DJANGO_ALLOWED_HOSTS=python-data-science,localhost,127.0.0.1,*
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=postgres
      - DB_PASS=supersecretpassword123
      - DB_NAME=financiero
    depends_on:
      mysql:
        condition: service_healthy

  # 4. Backend Spring Boot
  backend:
    build:
      context: ../backend-SpringBoot
      dockerfile: Dockerfile
    container_name: spring_backend
    ports:
      - "8080:8080"
    env_file:
      - ../backend-SpringBoot/.env
    environment:
      - DB_HOST=mysql
      - CORS_ORIGINS=http://localhost:4000
      - DS_SERVICE_URL=http://python-data-science:8000
    depends_on:
      mysql:
        condition: service_healthy

  # 5. Frontend Angular
  frontend:
    build:
      context: ../frontend-Angular
      dockerfile: Dockerfile
    container_name: angular_frontend
    ports:
      - "4000:4000"
    env_file:
      - ../frontend-Angular/.env
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-FincoachG9LatamTeam14DevSecretKey2026MustBeAtLeast256BitsLong!!}
    depends_on:
      - backend

volumes:
  mysql_data:
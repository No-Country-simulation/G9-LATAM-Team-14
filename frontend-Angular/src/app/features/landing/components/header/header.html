<header
    class="w-full bg-[#f3f7d2]/90 backdrop-blur-md border-b border-[#E1E6C2] sticky top-0 z-50 transition-all duration-300 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 sm:py-3 flex justify-between items-center">
        <a href="#" class="flex items-center gap-2.5 group focus:outline-none">
            <img src="images/logo.webp" alt="Fincoach"
                class="w-9 h-9 sm:w-10 sm:h-10 object-contain transition-transform group-hover:scale-105" />
            <span class="text-xl sm:text-2xl font-extrabold text-[#214523] tracking-tight">Fincoach</span>
        </a>
        <nav class="hidden md:flex items-center gap-1.5 bg-[#E2EBB6]/60 p-1.5 rounded-full border border-[#D5E0A5]">
            @for (item of navItems; track item.label) {
            <a [href]="item.link" (click)="setActive(item.label)"
                [class]="item.label === activeItem 
                    ? 'bg-[#214523] text-white shadow-xs font-semibold px-4 py-1.5 rounded-full text-sm transition-all duration-200' 
                    : 'text-[#3b523e] hover:text-[#214523] hover:bg-[#D4E0A5]/60 font-medium px-4 py-1.5 rounded-full text-sm transition-all duration-200'">
                {{ item.label }}
            </a>
            }
        </nav>

        <div class="hidden md:flex items-center gap-3">
            <app-green-redirect-button link="/login" text="Ingresar"
                customClass="rounded-xl px-5 py-2.5 text-sm font-semibold shadow-xs hover:shadow-md transition-all" />
        </div>
        <button (click)="toggleMenu($event)"
            class="md:hidden text-[#214523] hover:bg-[#E2EBB6] p-2 justify-center items-center flex rounded-xl border border-[#D5E0A5] transition-colors focus:outline-none"
            aria-label="Abrir menú">
            @if (!isMenuOpen) {
            <app-icon-fin-coach name="menu" class="w-6 h-6" />
            } @else {
            <app-icon-fin-coach name="close" class="w-6 h-6" />
            }
        </button>

    </div>
    @if (isMenuOpen) {
    <div
        class="md:hidden absolute right-4 top-16 w-56 bg-[#f3f7d2]/95 backdrop-blur-xl border border-[#D5E0A5] rounded-2xl shadow-xl z-50 flex flex-col p-4 gap-3">
        <ul class="flex flex-col gap-1">
            @for (item of navItems; track item.label) {
            <li>
                <a [href]="item.link" (click)="setActive(item.label)"
                    [class]="item.label === activeItem 
                        ? 'bg-[#214523]/50 text-white font-semibold block px-3.5 py-2 rounded-xl text-sm shadow-xs' 
                        : 'text-[#3b523e] hover:text-[#214523]/50 hover:bg-[#E2EBB6] font-medium block px-3.5 py-2 rounded-xl text-sm transition-colors'">
                    {{ item.label }}
                </a>
            </li>
            }
        </ul>
        <hr class="border-[#D5E0A5]/80 my-0.5">
        <app-green-redirect-button link="/login" text="Ingresar"
            customClass="w-full inline-flex justify-center items-center rounded-xl py-2.5 text-sm font-semibold text-center shadow-xs" />
    </div>
    }
</header>

<div class="space-y-4">
    <div>
        <h2 class="text-xl xl:text-2xl font-bold text-[#214523] tracking-tight">Frecuencia de ahorro</h2>
        <p class="text-xs text-[#526655] font-medium mt-0.5">Calculada automáticamente por el sistema según tu registro de movimientos.</p>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-2.5 xl:gap-3">
        <div [class]="'p-4 rounded-2xl border transition-all text-center space-y-1 ' + (normFrequency() === 'baja' ? 'bg-[#2F4836] text-white border-[#2F4836] shadow-md' : 'bg-[#F4F8DE] text-[#214523] border-[#E0ECC0] opacity-80')">
            <p class="font-bold text-sm xl:text-base">Baja</p>
            <p [class]="'text-xs font-medium ' + (normFrequency() === 'baja' ? 'text-white/80' : 'text-[#526655]')">Ahorro rara vez</p>
        </div>

        <div [class]="'p-4 rounded-2xl border transition-all text-center space-y-1 ' + (normFrequency() === 'media' ? 'bg-[#2F4836] text-white border-[#2F4836] shadow-md' : 'bg-[#F4F8DE] text-[#214523] border-[#E0ECC0] opacity-80')">
            <p class="font-bold text-sm xl:text-base">Media</p>
            <p [class]="'text-xs font-medium ' + (normFrequency() === 'media' ? 'text-white/80' : 'text-[#526655]')">Ahorro algunos meses</p>
        </div>

        <div [class]="'p-4 rounded-2xl border transition-all text-center space-y-1 ' + (normFrequency() === 'alta' ? 'bg-[#2F4836] text-white border-[#2F4836] shadow-md' : 'bg-[#F4F8DE] text-[#214523] border-[#E0ECC0] opacity-80')">
            <p class="font-bold text-sm xl:text-base">Alta</p>
            <p [class]="'text-xs font-medium ' + (normFrequency() === 'alta' ? 'text-white/80' : 'text-[#526655]')">Ahorro todos los meses</p>
        </div>
    </div>
</div>

<div class="space-y-3">
    <div class="flex items-center gap-2">
        <app-icon-fin-coach name="dashboard" class="w-4 h-4 text-[#214523]" />
        <h2 class="text-xs font-bold text-[#5A7259] uppercase tracking-wider">Nivel de endeudamiento</h2>
    </div>

    <div class="flex items-center gap-4 sm:gap-6 bg-[#F4F8DE] p-4 rounded-2xl border border-[#C9DAA7]">
        <!-- Círculo de Porcentaje (SVG Donut Chart) -->
        <div class="relative w-24 h-24 sm:w-26 sm:h-26 shrink-0 flex items-center justify-center">
            <svg class="w-full h-full -rotate-90" viewBox="0 0 80 80">
                <!-- Círculo Fondo -->
                <circle cx="40" cy="40" r="36" fill="transparent" stroke="#D7E3A9" stroke-width="7" />
                <!-- Círculo Progreso -->
                <circle cx="40" cy="40" r="36" fill="transparent" [attr.stroke]="strokeColor()" stroke-width="7"
                    stroke-linecap="round" [attr.stroke-dasharray]="circumference"
                    [attr.stroke-dashoffset]="strokeDashOffset()" class="transition-all duration-700 ease-out" />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                <span class="text-xl sm:text-2xl font-black text-[#214523] leading-none">{{ incomePercentage() }}%</span>
                <span class="text-[10px] font-semibold text-[#526655]">de ingreso</span>
            </div>
        </div>

        <!-- Información de lo que dice su porcentaje -->
        <div class="min-w-0 flex-1 space-y-1.5">
            <div class="flex items-center gap-2 flex-wrap">
                <span [class]="'px-2.5 py-0.5 rounded-full text-xs font-extrabold shadow-2xs ' + debtStatusBadge().class">
                    {{ debtStatusBadge().label }}
                </span>
                <span class="text-xs text-[#526655] font-semibold">Máximo recomendado: 35%</span>
            </div>
            <p class="text-lg sm:text-xl font-extrabold text-[#214523] tracking-tight">
                $ {{ monthlyPayment() | number:'1.0-0' }} <span class="text-xs font-medium text-[#526655]">/ mes en cuotas</span>
            </p>
            <p class="text-xs text-[#526655] font-medium leading-tight">
                Destinas el {{ incomePercentage() }}% de tu ingreso mensual al pago de cuotas de deudas.
            </p>
        </div>
    </div>
</div>

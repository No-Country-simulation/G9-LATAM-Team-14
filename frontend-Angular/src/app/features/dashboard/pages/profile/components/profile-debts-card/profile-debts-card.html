<div class="bg-[#EFF5D3] rounded-3xl p-5 sm:p-7 border border-[#DCE8B5] shadow-xs space-y-4">
    <h2 class="text-xl sm:text-2xl font-bold text-[#214523] tracking-tight">¿Tienes deudas?</h2>

    <div class="space-y-3">
        @for (debt of debts(); track debt.id) {
        <div class="bg-[#F4F8DE] p-3.5 sm:p-4 rounded-2xl border border-[#E0ECC0] flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 sm:gap-3 shadow-xs hover:border-[#D6E4B4] transition-all">
            <div class="flex items-center gap-3.5 min-w-0 flex-1">
                <div class="w-10 h-10 rounded-xl bg-[#FCE6D4] text-[#D96B27] flex items-center justify-center shrink-0 shadow-xs">
                    <app-icon-fin-coach [name]="debt.iconName" class="w-5 h-5" />
                </div>
                <div class="min-w-0 flex-1">
                    <h3 class="font-bold text-[#214523] text-sm sm:text-base leading-snug truncate">{{ debt.category }}</h3>
                    <p class="text-xs text-[#526655] font-medium truncate">{{ debt.subtitle }}</p>
                </div>
            </div>
            <div class="text-left sm:text-right shrink-0">
                <span class="font-bold text-[#214523] text-sm sm:text-base">{{ debt.monthlyAmountText }}</span>
            </div>
        </div>
        }
    </div>

    <div class="pt-1 text-center">
        <a routerLink="/dashboard/debts"
            class="inline-flex items-center justify-center text-xs sm:text-sm font-bold text-[#2F4836] hover:text-[#223628] transition-colors cursor-pointer gap-1.5">
            <span>Ver más</span>
            <app-icon-fin-coach name="arrow-right" class="w-3.5 h-3.5" />
        </a>
    </div>
</div>

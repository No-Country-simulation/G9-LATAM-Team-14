<div class="max-w-6xl mx-auto space-y-6 pb-12 animate-fadeIn w-full">
    <app-profile-header [isEditing]="goalsIncomeCard?.isEditing() || false" (editToggle)="onHeaderEditToggle()"
        (saveClick)="onHeaderSave()" (cancelClick)="onHeaderCancel()">
    </app-profile-header>

    <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
        <div class="xl:col-span-7 space-y-6 flex flex-col gap-1.5 min-w-0">
            <app-profile-goals-income-card [(income)]="monthlyIncome"></app-profile-goals-income-card>
            <app-profile-debts-card [debts]="activeDebts()"></app-profile-debts-card>
            <app-debt-ratio-card [monthlyPayment]="summaryData().totalMonthlyPayment"
                [incomePercentage]="summaryData().incomePercentage"></app-debt-ratio-card>
            <app-savings-frequency-card [frequency]="savingsFrequency()"></app-savings-frequency-card>
        </div>

        <div class="xl:col-span-5 sticky top-6 min-w-0">
            <app-monthly-projection-card [income]="monthlyIncome()"
                [debtPayment]="summaryData().totalMonthlyPayment"></app-monthly-projection-card>
        </div>
    </div>
</div>

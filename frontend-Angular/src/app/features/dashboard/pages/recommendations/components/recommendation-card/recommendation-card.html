<div
  class="bg-white rounded-2xl p-5 border border-[#C3C8BF] border-l-4 transition hover:shadow-md"
  [class]="styles.border"
>
  <div class="flex items-center justify-between mb-3">
    <span
      class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full"
      [class]="styles.badge"
    >
      {{ recommendation().prioridad }}
    </span>
    <span class="text-[11px] font-semibold text-[#526655] uppercase tracking-wider">
      {{ recommendation().categoria }}
    </span>
  </div>

  <h3 class="text-[15px] font-bold text-[#214523] mb-2 leading-tight">
    {{ recommendation().titulo }}
  </h3>

  <p class="text-[13px] text-[#364234] leading-relaxed mb-4">
    {{ recommendation().descripcion }}
  </p>

  <div class="flex items-center gap-3 mb-4">
    <div class="flex-1">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-[11px] font-medium text-[#526655] uppercase tracking-wider">Impacto</span>
        <span class="text-[13px] font-bold text-[#425942]">+{{ recommendation().impacto }} pts</span>
      </div>
      <div class="w-full bg-[#E7EBC7] rounded-full h-2 overflow-hidden">
        <div
          class="h-2 rounded-full transition-all duration-700 bg-[#425942]"
          [style.width.%]="impactPercent"
        ></div>
      </div>
    </div>

    <div class="flex items-center gap-1.5">
      @if (recommendation().completada) {
        <span class="inline-flex items-center gap-1 text-[12px] font-semibold px-2.5 py-1 rounded-full bg-[#556F53]/15 text-[#556F53]">
          <span class="w-1.5 h-1.5 rounded-full bg-[#556F53]"></span>
          Completada
        </span>
      } @else {
        <span class="inline-flex items-center gap-1 text-[12px] font-semibold px-2.5 py-1 rounded-full bg-[#E7EBC7] text-[#364234]">
          <span class="w-1.5 h-1.5 rounded-full bg-[#A15B3E]"></span>
          Pendiente
        </span>
      }
    </div>
  </div>

  <div class="bg-[#E1E6C2]/60 rounded-xl p-3.5 mb-4">
    <p class="text-[12px] text-[#364234] italic leading-relaxed">
      "{{ recommendation().insight }}"
    </p>
  </div>

  <button
    class="w-full py-2.5 rounded-xl text-[13px] font-bold uppercase tracking-wider transition-all"
    [class]="recommendation().completada
      ? 'bg-[#E7EBC7] text-[#526655] cursor-default'
      : 'bg-[#425942] text-white hover:bg-[#214523]'"
  >
    {{ recommendation().completada ? 'Completada' : recommendation().accionLabel }}
  </button>
</div>

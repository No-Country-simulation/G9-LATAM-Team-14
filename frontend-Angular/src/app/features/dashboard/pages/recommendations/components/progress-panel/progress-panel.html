<div class="bg-white rounded-2xl p-5 border border-[#C3C8BF]">
  <h3 class="text-[15px] font-bold text-[#214523] mb-4">Tu progreso</h3>

  <div class="w-full max-w-[180px] mx-auto mb-5">
    <canvas baseChart
      [data]="chartData()"
      [options]="chartOptions"
      chartType="doughnut">
    </canvas>
  </div>

  <div class="space-y-2.5">
    @for (rec of recommendations(); track rec.id) {
      <div class="flex items-center gap-2.5 py-2 px-3 rounded-lg transition"
           [class]="rec.completada ? 'bg-[#556F53]/8' : 'bg-[#F8F9F5]'">
        <div class="relative flex-shrink-0">
          @if (rec.completada) {
            <div class="w-[18px] h-[18px] rounded-md bg-[#425942] flex items-center justify-center">
              <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
          } @else {
            <div class="w-[18px] h-[18px] rounded-md border-2 border-[#C3C8BF] bg-white"></div>
          }
        </div>
        <span class="text-[13px] leading-tight"
              [class]="rec.completada ? 'text-[#526655] line-through' : 'text-[#214523] font-medium'">
          {{ rec.titulo }}
        </span>
      </div>
    }
  </div>
</div>

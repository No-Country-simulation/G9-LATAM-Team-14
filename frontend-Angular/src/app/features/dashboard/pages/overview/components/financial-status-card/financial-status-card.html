<div class="bg-[#EFF5D3] rounded-xl p-4 sm:p-5 border border-[#DCE8B5] shadow-xs">
  <div class="flex flex-col xl:flex-row items-stretch xl:items-center justify-between gap-5 xl:gap-6">
    <!-- 1. Información Izquierda -->
    <div class="space-y-3 flex-1 min-w-0 w-full order-1">
      <div>
        <span
          class="inline-block bg-[#FADCD9] text-[#D9534F] text-[11px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider shadow-2xs">
          {{ status }}
        </span>
      </div>

      <div class="space-y-0.5">
        <h1 class="text-2xl xl:text-3xl font-extrabold text-[#214523] tracking-tight">
          {{ title }}
        </h1>
        <p class="text-xs xl:text-sm text-[#526655] font-medium">
          {{ subtitle }}
        </p>
      </div>

      <!-- Botón Desktop (visible solo en xl) -->
      <div class="pt-1 hidden xl:block">
        <a routerLink="/dashboard/profile"
          class="bg-[#2F4836] hover:bg-[#223628] text-white px-4 py-2.5 rounded-xl text-xs xl:text-sm font-bold shadow-xs inline-flex items-center gap-2 transition-all cursor-pointer">
          <span>Ver detalle</span>
          <app-icon-fin-coach name="arrow-right" class="w-4 h-4" />
        </a>
      </div>
    </div>

    <!-- 2. Círculo de Confianza IA -->
    <div class="shrink-0 self-center xl:self-auto order-2">
      <div class="relative w-28 h-28 xl:w-32 xl:h-32 flex items-center justify-center">
        <svg class="w-full h-full -rotate-90" viewBox="0 0 80 80">
          <!-- Círculo Fondo Base -->
          <circle cx="40" cy="40" r="36" fill="transparent" stroke="#D7E3A9" stroke-width="7" />
          <!-- Círculo Progreso Verde -->
          <circle cx="40" cy="40" r="36" fill="transparent" stroke="#214523" stroke-width="7" stroke-linecap="round"
            [attr.stroke-dasharray]="circumference" [attr.stroke-dashoffset]="strokeDashOffset"
            class="transition-all duration-700 ease-out" />
        </svg>

        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
          <span class="text-xl xl:text-2xl font-black text-[#214523] leading-none tracking-tight">{{ confidence
            }}</span>
          <span class="text-[9px] xl:text-[10px] font-bold uppercase tracking-wider text-[#526655] pt-0.5">CONFIANZA
            IA</span>
        </div>
      </div>
    </div>

    <!-- 3. Botón Móvil (visible solo en < xl, ubicado al final abajo) -->
    <div class="w-full xl:hidden order-3 pt-1">
      <a routerLink="/dashboard/profile"
        class="w-full bg-[#2F4836] hover:bg-[#223628] text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-xs inline-flex items-center justify-center gap-2 transition-all cursor-pointer">
        <span>Ver detalle</span>
        <app-icon-fin-coach name="arrow-right" class="w-4 h-4" />
      </a>
    </div>
  </div>
</div>

<div class="grid grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-4">
  @for (metric of metrics; track metric.title) {
  <div class="bg-[#EFF5D3] rounded-2xl sm:rounded-3xl p-3.5 sm:p-5 border border-[#DCE8B5] shadow-xs space-y-2 sm:space-y-3 flex flex-col justify-between hover:border-[#C9DAA7] transition-all">
    <!-- Top Row: Title + Icon Badge -->
    <div class="flex items-center justify-between gap-1.5 sm:gap-2">
      <span class="text-[11px] sm:text-xs font-semibold text-[#5A7259] truncate">{{ metric.title }}</span>
      <div [class]="'w-7 h-7 sm:w-8 sm:h-8 rounded-lg sm:rounded-xl flex items-center justify-center shrink-0 shadow-2xs ' + metric.badgeBg + ' ' + metric.badgeColor">
        <app-icon-fin-coach [name]="metric.icon" class="w-3.5 h-3.5 sm:w-4 sm:h-4" />
      </div>
    </div>

    <!-- Middle Row: Big Amount -->
    <div>
      <h2 class="text-xl sm:text-3xl font-black text-[#214523] tracking-tight leading-none">
        {{ metric.amount }}
      </h2>
    </div>

    <!-- Bottom Row: Subtitle -->
    <div>
      <p class="text-[10px] sm:text-xs text-[#526655] font-medium truncate">
        {{ metric.detail }}
      </p>
    </div>
  </div>
  }
</div>

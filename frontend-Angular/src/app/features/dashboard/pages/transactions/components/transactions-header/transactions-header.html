<div class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
  <div>
    <h1 class="text-[40px] leading-[48px] font-bold tracking-[-0.02em] text-[#1a1d07]">
      Transacciones
    </h1>
    <p class="text-base leading-6 text-[#434841]">
      {{ totalItems }} movimientos clasificados automáticamente
    </p>
  </div>
</div>

<div class="bg-[#f3f7d2] p-4 rounded-xl border border-[#c3c8bf] flex flex-col lg:flex-row lg:items-center gap-3 mb-6">
  <div class="relative flex-1 min-w-0 lg:min-w-[280px]">
    <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-[#434841] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path [attr.d]="iconPath('search')" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <input
      type="text"
      placeholder="Buscar transacción..."
      class="w-full bg-[#edf1cd] pl-11 pr-4 py-2 rounded-lg border-none focus:ring-2 focus:ring-[#425942]"
      [value]="searchTerm"
      (input)="searchTermChange.emit($any($event.target).value)" />
  </div>

  <div class="flex flex-1 min-w-0 flex-wrap items-center gap-2 lg:flex-nowrap lg:justify-end">
    <div class="relative">
      <button
        type="button"
        (click)="toggleDateRangePicker.emit()"
        class="flex items-center self-stretch whitespace-nowrap bg-[#edf1cd] px-4 py-2 rounded-lg">
        <svg class="h-4 w-4 text-[#434841] mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path [attr.d]="iconPath('calendar_today')" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span class="text-sm text-[#1a1d07] font-semibold">{{ dateRangeLabel }}</span>
      </button>

      @if (showDateRangePicker) {
        <div class="absolute right-0 top-[calc(100%+8px)] z-20 w-72 rounded-xl border border-[#c3c8bf] bg-[#f3f7d2] p-3 shadow-lg">
          <div class="space-y-3">
            <div>
              <label class="mb-1 block text-xs font-semibold text-[#434841]">Fecha inicial</label>
              <input
                type="date"
                class="w-full rounded-lg border border-[#c3c8bf] bg-white px-3 py-2 text-sm text-[#1a1d07]"
                [value]="tempStartDateFilter || ''"
                (input)="tempStartDateFilterChange.emit($any($event.target).value || null)" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-semibold text-[#434841]">Fecha final</label>
              <input
                type="date"
                class="w-full rounded-lg border border-[#c3c8bf] bg-white px-3 py-2 text-sm text-[#1a1d07]"
                [value]="tempEndDateFilter || ''"
                (input)="tempEndDateFilterChange.emit($any($event.target).value || null)" />
            </div>
          </div>
          <div class="mt-3 flex justify-end gap-2">
            <button
              type="button"
              (click)="clearDateRange.emit()"
              class="rounded-lg border border-[#c3c8bf] px-3 py-1.5 text-xs font-semibold text-[#434841]">
              Limpiar
            </button>
            <button
              type="button"
              (click)="cancelDateRange.emit()"
              class="rounded-lg border border-[#c3c8bf] px-3 py-1.5 text-xs font-semibold text-[#434841]">
              Cancelar
            </button>
            <button
              type="button"
              (click)="applyDateRange.emit()"
              class="rounded-lg bg-[#425942] px-3 py-1.5 text-xs font-semibold text-white">
              Aplicar
            </button>
          </div>
        </div>
      }
    </div>

    <button
      type="button"
      (click)="exportTransactions.emit()"
      class="flex shrink-0 items-center whitespace-nowrap bg-[#425942] text-white px-6 py-2 rounded-lg font-semibold hover:bg-[#5a7259]">
      <svg class="h-4 w-4 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path [attr.d]="iconPath('download')" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      Exportar
    </button>
  </div>
</div>

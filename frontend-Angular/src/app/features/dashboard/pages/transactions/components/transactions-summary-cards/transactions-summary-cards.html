<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
  <div class="bg-[#f3f7d2] p-6 rounded-xl border border-[#c3c8bf]">
    <div class="flex justify-between items-start mb-4">
      <span class="text-xs font-medium uppercase tracking-wider text-[#434841]">Alimentación</span>
      <span class="grid h-9 w-9 place-items-center rounded-lg bg-[#dbf6d7]">
        <svg class="h-5 w-5 text-[#425942]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 3v7a4 4 0 0 0 4 4v7M8 3v11M12 3v11M16 3h1a3 3 0 0 1 3 3v15" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </span>
    </div>
    <span class="text-2xl font-semibold text-[#1a1d07]">{{ alimentacionTotal }}</span>
    <div class="mt-4 h-1.5 rounded-full bg-[#e1e6c2]">
      <div class="h-full rounded-full bg-[#425942]" [style.width.%]="alimentacionProgress"></div>
    </div>
  </div>

  <div class="bg-[#f3f7d2] p-6 rounded-xl border border-[#c3c8bf]">
    <div class="flex justify-between items-start mb-4">
      <span class="text-xs font-medium uppercase tracking-wider text-[#434841]">Transporte</span>
      <span class="grid h-9 w-9 place-items-center rounded-lg bg-[#fdd2b1]">
        <svg class="h-5 w-5 text-[#78583e]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 11h14l-1.5-4.5A3 3 0 0 0 14.65 4h-5.3a3 3 0 0 0-2.85 2.5L5 11Zm0 0v5h2m12-5v5h-2M7 16a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </span>
    </div>
    <span class="text-2xl font-semibold text-[#1a1d07]">{{ transporteTotal }}</span>
    <div class="mt-4 h-1.5 rounded-full bg-[#e1e6c2]">
      <div class="h-full rounded-full bg-[#78583e]" [style.width.%]="transporteProgress"></div>
    </div>
  </div>

  <div class="bg-[#f3f7d2] p-6 rounded-xl border border-[#c3c8bf]">
    <div class="flex justify-between items-start mb-4">
      <span class="text-xs font-medium uppercase tracking-wider text-[#434841]">Servicios</span>
      <span class="grid h-9 w-9 place-items-center rounded-lg bg-[#ffdcbb]">
        <svg class="h-5 w-5 text-[#77490c]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </span>
    </div>
    <span class="text-2xl font-semibold text-[#1a1d07]">{{ serviciosTotal }}</span>
    <div class="mt-4 h-1.5 rounded-full bg-[#e1e6c2]">
      <div class="h-full rounded-full bg-[#77490c]" [style.width.%]="serviciosProgress"></div>
    </div>
  </div>

  <div class="bg-[#f3f7d2] p-6 rounded-xl border border-[#c3c8bf]">
    <div class="flex justify-between items-start mb-4">
      <span class="text-xs font-medium uppercase tracking-wider text-[#434841]">Ocio</span>
      <span class="grid h-9 w-9 place-items-center rounded-lg bg-[#faba75]">
        <svg class="h-5 w-5 text-[#673d00]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 8h14a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3h-2l-3 3-3-3H5a3 3 0 0 1-3-3v-2a3 3 0 0 1 3-3Zm3 4h2m4 0h2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </span>
    </div>
    <span class="text-2xl font-semibold text-[#1a1d07]">{{ ocioTotal }}</span>
    <div class="mt-4 h-1.5 rounded-full bg-[#e1e6c2]">
      <div class="h-full rounded-full bg-[#faba75]" [style.width.%]="ocioProgress"></div>
    </div>
  </div>
</div>

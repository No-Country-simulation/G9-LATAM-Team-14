<div class="flex flex-col gap-8 sm:gap-10 pb-8">

  <!-- Header con píldoras de resumen del mes anterior y mes actual -->
  <app-evolution-header
    [perfilMensual]="data()?.perfilMensual || []"
    [ingresosVsGastos]="data()?.ingresosVsGastos || []"
  />

  <!-- Sección Comparativa de Indicadores Mensuales -->
  <app-recent-evolution
    [ingresosVsGastos]="data()?.ingresosVsGastos || []"
    [perfilMensual]="data()?.perfilMensual || []"
    [isLoading]="isLoading()">
  </app-recent-evolution>

  <!-- Score de Salud Financiera -->
  <app-score-line-chart
    [perfilMensual]="data()?.perfilMensual || []"
    [ultimoMes]="data()?.ultimoMes || ''"
    [ultimoScore]="data()?.ultimoScore || 50"
  />

  <!-- Historial de Evaluaciones -->
  <app-analysis-history-table [historial]="data()?.historial || []" />

</div>

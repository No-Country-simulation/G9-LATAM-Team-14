<div class="bg-[#EDF1CD] rounded-2xl p-6 md:p-8 border border-[#C3C8BF] relative overflow-hidden">
    <div class="flex flex-col md:flex-row md:items-start justify-between gap-4 mb-6">
        <div>
            <h2 class="text-lg sm:text-xl font-bold text-[#214523] tracking-tight mb-1">Perfil financiero en el tiempo</h2>
            <p class="text-xs sm:text-sm text-[#526655]">Índice de salud algorítmica (0-100)</p>
        </div>
        <div class="text-left md:text-right">
            <div class="flex items-baseline gap-1">
                <span class="text-4xl sm:text-[48px] font-extrabold text-[#214523] leading-none">{{ ultimoScore() }}</span>
                <span class="text-lg font-semibold text-[#526655]">/100</span>
            </div>
            <p class="text-xs font-semibold text-[#425942] uppercase tracking-wider mt-1">{{ ultimoMesLabel() }}</p>
        </div>
    </div>

    <div class="h-64 w-full relative">
        <canvas baseChart [data]="chartData()" [options]="chartOptions" [type]="chartType"></canvas>
    </div>

    <div class="flex justify-between mt-4 px-2">
        @for (label of labels(); track label) {
            <span class="text-xs font-medium text-[#526655]">{{ label }}</span>
        }
    </div>
</div>

<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between pb-3 border-b border-[#CFCFAE]">
    <div>
      <p class="text-[10px] font-extrabold uppercase tracking-wider text-[#526650]">Score de Salud Financiera</p>
      <h3 class="text-lg font-bold text-[#2F3A2F]">Evolución del Score</h3>
    </div>
    <div class="flex items-center gap-2 bg-[#4A6042] text-white px-3.5 py-1 rounded-full">
      <span class="text-xs font-semibold">Último Score:</span>
      <span class="text-xs font-extrabold">{{ ultimoScore }} / 100</span>
    </div>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3.5">
    @for (item of perfilMensual; track item.mes) {
      <div class="rounded-2xl border border-[#CFCFAE] p-4 text-center space-y-2 shadow-2xs">
        <p class="text-xs font-extrabold uppercase tracking-wider text-[#2F3A2F]">{{ item.mes }}</p>
        <p class="text-2xl font-extrabold text-[#2F3A2F]">{{ item.score }}</p>
        <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold border border-[#CFCFAE]"
          [class.bg-[#E3E8C4]]="item.score >= 70" [class.text-[#2F3A2F]]="item.score >= 70"
          [class.bg-[#F8E7D5]]="item.score < 70" [class.text-[#8A4D35]]="item.score < 70">
          {{ item.estado }}
        </span>
      </div>
    }
  </div>
</div>

<div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8">
    <div>
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-[#214523] tracking-tight">Evolución financiera</h1>
        <p class="text-xs sm:text-sm text-[#526655] mt-1">Tu comportamiento en los últimos 6 meses</p>
    </div>

    <div class="inline-flex self-start md:self-auto bg-[#E7EBC7] border border-[#C3C8BF] rounded-xl p-1 gap-1">
        @for (option of ranges; track option) {
            <button
                type="button"
                (click)="selectRange(option)"
                class="px-4 py-1.5 text-sm font-semibold rounded-lg transition-colors cursor-pointer"
                [ngClass]="range() === option
                    ? 'bg-[#425942] text-white shadow-sm'
                    : 'text-[#526655] hover:bg-[#E1E6C2]'"
            >{{ option }}</button>
        }
    </div>
</div>

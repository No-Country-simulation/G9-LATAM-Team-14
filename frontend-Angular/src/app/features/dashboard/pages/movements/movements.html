<app-movements-header
  [currentDate]="currentDate"
  (openModal)="openModal()">
</app-movements-header>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">

  <div class="lg:col-span-2">
    <app-movements-list
      [movements]="movements">
    </app-movements-list>
  </div>

  <div>
    <app-movements-summary-cards
      [movements]="movements">
    </app-movements-summary-cards>
  </div>

</div>

@if (isModalOpen) {
<app-movement-modal
  (close)="closeModal()"
  (save)="saveMovement($event)">
</app-movement-modal>
}

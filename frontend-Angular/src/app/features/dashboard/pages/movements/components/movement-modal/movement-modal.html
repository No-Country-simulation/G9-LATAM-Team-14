<!-- movement-modal.html -->

<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">

  <!-- Modal -->
  <div
    class="bg-[#FDFEEA]
           border
           border-[#D6D6B8]
           rounded-3xl
           shadow-2xl
           w-full
           max-w-xl
           max-h-[90vh]
           flex
           flex-col">

    <!-- Header -->
    <div class="flex justify-between items-center p-8 pb-6 shrink-0">

      <h2 class="text-3xl font-semibold text-[#364234]">
        Nuevo Movimiento
      </h2>

      <button
        type="button"
        (click)="closeModal()"
        class="text-[#6B6B5D] hover:text-[#364234] text-2xl">

        ✕

      </button>

    </div>

    <!-- Contenido con scroll -->
    <div class="flex-1 overflow-y-auto px-8 pb-8">

      <form class="space-y-6">

        <!-- Tipo -->
        <div class="grid grid-cols-2 border border-[#D6D6B8] rounded-2xl p-1">

          <button
            type="button"
            (click)="selectType('GASTO')"
            class="py-3 rounded-xl font-medium transition"
            [ngClass]="movement.type==='GASTO'
              ? 'bg-[#4E6545] text-white'
              : 'text-[#364234] hover:bg-[#EEF2D2]'">

            Gasto

          </button>

          <button
            type="button"
            (click)="selectType('INGRESO')"
            class="py-3 rounded-xl font-medium transition"
            [ngClass]="movement.type==='INGRESO'
              ? 'bg-[#4E6545] text-white'
              : 'text-[#364234] hover:bg-[#EEF2D2]'">

            Ingreso

          </button>

        </div>

        <!-- Descripción -->
        <div>

          <label class="block mb-2 font-medium text-[#364234]">

            {{ movement.type === 'GASTO'
            ? '¿En qué gastaste?'
            : '¿Cómo obtuviste este ingreso?' }}

          </label>

          <input
            type="text"
            name="description"
            [(ngModel)]="movement.description"
            [placeholder]="movement.type === 'GASTO'
            ? 'Ej. Almuerzo menú'
            : 'Ej. Pago de sueldo'"
            class="w-full rounded-xl border border-[#D6D6B8] bg-[#FAFCD9] p-4 focus:outline-none focus:border-[#4E6545]">

        </div>

        <!-- Monto -->
        <div>

          <label class="block mb-2 font-medium text-[#364234]">

            Monto (S/)

          </label>

          <input
            type="number"
            step="0.01"
            name="amount"
            [(ngModel)]="movement.amount"
            placeholder="0.00"
            class="w-full rounded-xl border border-[#D6D6B8] bg-[#FAFCD9] p-4 focus:outline-none focus:border-[#4E6545]">

        </div>

        <!-- Fecha -->
        <div>

          <label class="block mb-2 font-medium text-[#364234]">

            Fecha

          </label>

          <input
            type="date"
            name="date"
            [(ngModel)]="movement.date"
            class="w-full rounded-xl border border-[#D6D6B8] bg-[#FAFCD9] p-4 focus:outline-none focus:border-[#4E6545]">

        </div>

        <!-- Categorías -->
        <div>

          <label class="block mb-3 font-medium text-[#364234]">

            Categorías rápidas

          </label>

          <div class="flex flex-wrap gap-3">

            @for (category of categories; track category) {

            <button
              type="button"
              (click)="selectCategory(category)"
              class="px-5 py-2 rounded-full border transition"
              [ngClass]="movement.category===category
                    ? 'bg-[#4E6545] text-white border-[#4E6545]'
                    : 'bg-[#FDFEEA] border-[#D6D6B8] text-[#364234] hover:bg-[#EEF2D2]'">

              {{ category }}

            </button>

            }

          </div>

        </div>

        <!-- Aviso -->
        <div class="bg-[#FBE4C8] border border-[#E8C18D] rounded-xl p-4">

          <p class="text-sm text-[#7B5328]">

            <strong>¿Pago de deuda?</strong>

            Tus cuotas ya están registradas en tu perfil para evitar duplicados.

          </p>

        </div>

        <!-- Botón -->
        <button
          type="button"
          (click)="registerMovement()"
          class="w-full bg-[#4E6545] hover:bg-[#44583D] text-white rounded-2xl py-4 font-semibold transition">

          Registrar Movimiento

        </button>

        <!-- Cancelar -->
        <div class="text-center">

          <button
            type="button"
            (click)="closeModal()"
            class="text-[#6B6B5D] hover:text-[#364234] transition">

            Cancelar y volver

          </button>

        </div>

      </form>

    </div>

  </div>

</div>

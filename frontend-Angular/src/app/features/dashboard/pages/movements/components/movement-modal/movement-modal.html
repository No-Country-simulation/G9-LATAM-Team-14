<!-- movement-modal.html -->
<!-- Plantilla Angular base para el modal -->

<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-8">

    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">Nuevo Movimiento</h2>

      <button
        type="button"
        (click)="closeModal()"
        class="text-gray-500 hover:text-black">
        ✕
      </button>
    </div>

    <form class="space-y-6">

      <!-- Tipo -->
      <div class="flex gap-2">
        <button
          type="button"
          (click)="selectType('GASTO')"
          [class.bg-green-700]="movement.type==='GASTO'"
          class="flex-1 rounded-lg border p-3">
          Gasto
        </button>

        <button
          type="button"
          (click)="selectType('INGRESO')"
          [class.bg-green-700]="movement.type==='INGRESO'"
          class="flex-1 rounded-lg border p-3">
          Ingreso
        </button>
      </div>

      <!-- Descripción -->
      <div>
        <label>Descripción</label>
        <input
          type="text"
          name="description"
          [(ngModel)]="movement.description"
          class="w-full border rounded-lg p-3">
      </div>

      <!-- Monto -->
      <div>
        <label>Monto</label>
        <input
          type="number"
          step="0.01"
          name="amount"
          [(ngModel)]="movement.amount"
          class="w-full border rounded-lg p-3">
      </div>

      <!-- Fecha -->
      <div>
        <label>Fecha</label>
        <input
          type="date"
          name="date"
          [(ngModel)]="movement.date"
          class="w-full border rounded-lg p-3">
      </div>

      <!-- Categoría -->
      <div>
        <label>Categoría</label>

        <div class="flex flex-wrap gap-2 mt-2">

          @for(category of categories; track category){

          <button
            type="button"
            (click)="selectCategory(category)"
            [class.bg-green-700]="movement.category === category"
            [class.text-white]="movement.category === category"
            [class.border-green-700]="movement.category === category"
            class="border rounded-full px-4 py-2 transition-all hover:bg-green-100">

            {{ category }}

          </button>
          }

        </div>

      </div>

      <!-- Acciones -->
      <div class="flex flex-col gap-3">

        <button
          type="button"
          (click)="registerMovement()"
          class="bg-green-700 text-white rounded-lg p-4">

          Registrar Movimiento

        </button>

        <button
          type="button"
          (click)="closeModal()"
          class="border rounded-lg p-4">

          Cancelar

        </button>

      </div>

    </form>

  </div>
</div>

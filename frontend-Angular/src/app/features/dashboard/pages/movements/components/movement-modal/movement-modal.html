<div class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center z-50 p-4">

  <!-- Modal Container -->
  <div class="bg-[#FDFEEA]
           border
           border-[#D6D6B8]
           rounded-3xl
           shadow-2xl
           w-full
           max-w-lg
           max-h-[90vh]
           flex
           flex-col
           overflow-hidden">

    <!-- Header -->
    <div class="flex justify-between items-center p-4 sm:p-5 pb-3 border-b border-[#D6D6B8]/50 shrink-0">

      <div>
        <h2 class="text-xl sm:text-2xl font-extrabold text-[#214523] tracking-tight">
          Nuevo movimiento
        </h2>
        <p class="text-xs text-[#4E6750] mt-0.5">
          Registra tus datos para ver el análisis en tiempo real.
        </p>
      </div>

      <button type="button" (click)="closeModal()"
        class="p-1.5 text-[#6B6B5D] hover:text-[#214523] text-lg font-bold transition rounded-full hover:bg-[#EAEFC8] cursor-pointer">
        ✕
      </button>

    </div>

    <!-- Contenido con scroll -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-5">

      <form (submit)="registerMovement(); $event.preventDefault()" class="w-full flex flex-col gap-3">

        <!-- Fila 1: Fecha y Hora -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="flex flex-col gap-1">
            <label for="modalMovementDate" class="text-xs font-semibold text-[#214523]">
              Fecha
            </label>
            <div class="relative flex items-center w-full">
              <input id="modalMovementDate" type="date" [(ngModel)]="date" name="date"
                class="w-full py-2 px-3 bg-[#EAEFC8]/80 border border-[#C9DAA7] rounded-xl text-xs text-[#214523] focus:outline-none focus:border-[#4A634E] font-medium shadow-xs" />
            </div>
          </div>
          <div class="flex flex-col gap-1">
            <label for="modalMovementTime" class="text-xs font-semibold text-[#214523]">
              Hora
            </label>
            <div class="relative flex items-center w-full">
              <input id="modalMovementTime" type="time" [(ngModel)]="time" name="time"
                class="w-full py-2 px-3 bg-[#EAEFC8]/80 border border-[#C9DAA7] rounded-xl text-xs text-[#214523] focus:outline-none focus:border-[#4A634E] font-medium shadow-xs" />
            </div>
          </div>
        </div>

        <!-- Fila 2: Tipo de movimiento -->
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-[#214523]">
            Tipo de movimiento
          </label>
          <div class="grid grid-cols-2 gap-3 w-full">
            <button type="button" (click)="selectType('INGRESO')" [class.bg-[#D7E3A9]]="movement.type === 'INGRESO'"
              [class.border-[#3E5741]]="movement.type === 'INGRESO'" [class.ring-2]="movement.type === 'INGRESO'"
              [class.ring-[#3E5741]/30]="movement.type === 'INGRESO'"
              [class.bg-[#EAEFC8]/80]="movement.type !== 'INGRESO'"
              [class.border-[#C9DAA7]]="movement.type !== 'INGRESO'"
              class="flex items-center justify-center gap-2 py-2 px-3 rounded-xl border text-xs font-bold text-[#214523] transition-all duration-200 hover:bg-[#E3EAA5] hover:border-[#4A634E] cursor-pointer shadow-xs">
              <app-icon-fin-coach name="arrow-up" class="w-3.5 h-3.5 text-[#214523]" />
              <span>Ingreso</span>
            </button>

            <button type="button" (click)="selectType('GASTO')" [class.bg-[#D7E3A9]]="movement.type === 'GASTO'"
              [class.border-[#3E5741]]="movement.type === 'GASTO'" [class.ring-2]="movement.type === 'GASTO'"
              [class.ring-[#3E5741]/30]="movement.type === 'GASTO'" [class.bg-[#EAEFC8]/80]="movement.type !== 'GASTO'"
              [class.border-[#C9DAA7]]="movement.type !== 'GASTO'"
              class="flex items-center justify-center gap-2 py-2 px-3 rounded-xl border text-xs font-bold text-[#214523] transition-all duration-200 hover:bg-[#E3EAA5] hover:border-[#4A634E] cursor-pointer shadow-xs">
              <app-icon-fin-coach name="arrow-down" class="w-3.5 h-3.5 text-[#214523]" />
              <span>Gasto</span>
            </button>
          </div>
        </div>

        <!-- Fila 3: Título o descripción del movimiento -->
        <div class="flex flex-col gap-1">
          <label for="modalMovementDescription" class="text-xs font-semibold text-[#214523]">
            Título o descripción del movimiento
          </label>
          <input id="modalMovementDescription" type="text" [(ngModel)]="movement.description" name="description"
            [placeholder]="movement.type === 'GASTO' ? 'Ejemplo: comprar helado' : 'Ejemplo: pago de sueldo'"
            class="w-full py-2 px-3 bg-[#EAEFC8]/80 border border-[#C9DAA7] rounded-xl text-xs text-[#214523] focus:outline-none focus:border-[#4A634E] placeholder-[#6E8870] font-medium shadow-xs" />
        </div>

        <!-- Fila 4: Valor -->
        <div class="flex flex-col gap-1">
          <label for="modalMovementAmount" class="text-xs font-semibold text-[#214523]">
            Valor
          </label>
          <div class="relative flex items-center w-full">
            <span class="absolute left-3.5 text-[#4A634E] font-semibold text-xs">$</span>
            <input id="modalMovementAmount" type="number" step="0.01" [(ngModel)]="movement.amount" name="amount"
              placeholder="0.00"
              class="w-full pl-8 pr-3 py-2 bg-[#EAEFC8]/80 border border-[#C9DAA7] rounded-xl text-xs text-[#214523] focus:outline-none focus:border-[#4A634E] placeholder-[#6E8870] font-medium shadow-xs" />
          </div>
        </div>

        <!-- Fila 5: Nota o contexto -->
        <div class="flex flex-col gap-1">
          <label for="modalMovementNote" class="text-xs font-semibold text-[#214523]">
            Nota o contexto
          </label>
          <textarea id="modalMovementNote" rows="2" [(ngModel)]="movement.note" name="note"
            placeholder="Ejemplo: salida del fin de semana con amigos"
            class="w-full py-2 px-3 bg-[#EAEFC8]/80 border border-[#C9DAA7] rounded-xl text-xs text-[#214523] focus:outline-none focus:border-[#4A634E] placeholder-[#6E8870] font-medium shadow-xs resize-none"></textarea>
        </div>

        <!-- Acciones -->
        <div class="flex flex-col gap-1.5 mt-2">
          <button type="submit" [disabled]="isSubmitting"
            class="w-full py-2.5 bg-[#4E6545] hover:bg-[#44583D] disabled:opacity-60 text-white rounded-xl font-bold text-xs sm:text-sm transition shadow-xs cursor-pointer flex items-center justify-center gap-2">
            @if (isSubmitting) {
            <span>Analizando...</span>
            } @else {
            <span>Registrar Movimiento</span>
            }
          </button>
          <button type="button" (click)="closeModal()" [disabled]="isSubmitting"
            class="w-full py-1.5 text-[#6B6B5D] hover:text-[#214523] font-medium text-xs transition cursor-pointer disabled:opacity-50">
            Cancelar y volver
          </button>
        </div>
      </form>
    </div>
  </div>

  <app-ai-classification-modal [isOpen]="showAiModal" [description]="movement.description || movement.note || 'Nuevo movimiento'" [amount]="movement.amount"
    [type]="movement.type === 'INGRESO' ? 'INGRESO' : 'EGRESO'" [suggestion]="modelSuggestion"
    (confirm)="confirmAiClassification($event)" (close)="closeAiModal()" />

</div>

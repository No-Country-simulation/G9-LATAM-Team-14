<div class="bg-[#FDFEEA] rounded-3xl border border-[#D6D6B8] p-6">

  <h2 class="text-xl font-semibold text-[#364234] mb-6">
    Movimientos de hoy
  </h2>

  <div class="space-y-3 max-h-[600px] overflow-y-auto pr-2">

    <div
      *ngFor="let movement of movements"
      class="flex justify-between items-center bg-[#FAFCD9] rounded-2xl px-5 py-4 hover:bg-[#F5F8CF] transition">

      <!-- Información -->

      <div class="flex items-center gap-4">

        <!-- Icono -->

        <div
          class="w-11 h-11 rounded-xl bg-[#EEF2D2] flex items-center justify-center text-lg">

          {{ getIcon(movement.category) }}

        </div>

        <!-- Texto -->

        <div>

          <h3 class="font-medium text-[#364234]">

            {{ movement.description }}

          </h3>

          <div
            class="flex items-center gap-3 text-sm">

                        <span
                          class="uppercase px-2 py-1 rounded-md text-sm font-medium"
                          [ngClass]="movement.type === 'INGRESO'
                           ? 'bg-[#DDF3E3] text-[#4E6545]'
                           : 'bg-[#F8E7D5] text-[#9A6A3B]'">

                          {{ movement.category }}

                        </span>

            <span class="text-gray-500">

                            {{ formatTime(movement.date) }}

                        </span>

          </div>

        </div>

      </div>

      <!-- Monto -->

      <span
        class="font-semibold text-lg"
        [ngClass]="movement.type === 'INGRESO'
                    ? 'text-[#4A6042]'
                    : 'text-[#8B5A2B]'">

                {{ movement.type === 'INGRESO' ? '+' : '-' }}
                S/ {{ movement.amount }}

            </span>

    </div>

  </div>

</div>

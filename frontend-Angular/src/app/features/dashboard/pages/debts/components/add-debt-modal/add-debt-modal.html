@if (isOpen()) {
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 md:p-6 bg-black/60 backdrop-blur-xs animate-fadeIn">
  <div
    class="bg-[#EFF5D3] w-full max-w-xl max-h-[92vh] sm:max-h-[90vh] rounded-3xl shadow-2xl border border-[#DCE8B5] flex flex-col overflow-hidden animate-scaleUp">
    <app-modal-header [title]="debtToEdit() ? 'Editar Deuda / Obligación' : 'Registrar Deuda / Obligación'"
      (closeModal)="onClose()"></app-modal-header>
    <div class="p-5 sm:p-6 overflow-y-auto space-y-6 flex-1 custom-scrollbar">
      <app-debt-details-form [(category)]="installmentCategory" [(totalAmount)]="installmentTotalAmount"
        [(fixedTermMonths)]="fixedTermMonths" [(startDate)]="startDate"></app-debt-details-form>
      <div class="rounded-2xl border border-[#C6D8A2] bg-[#F4F8DE] px-4 py-3 text-sm text-[#214523]">
        <span class="font-semibold">Tasa de referencia:</span>
        {{ annualEffectiveRate() }}% EA · cuota estimada $ {{ calculatedMonthlyQuota().toLocaleString() }}
      </div>
    </div>
    <app-modal-footer [submitText]="debtToEdit() ? 'Guardar Cambios' : 'Registrar'" (closeModal)="onClose()"
      (submitForm)="onSubmit()"></app-modal-footer>

  </div>
</div>
}

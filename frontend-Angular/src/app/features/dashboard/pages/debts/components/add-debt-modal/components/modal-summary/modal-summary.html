<div class="bg-[#E4EEBF] p-4.5 sm:p-5 rounded-2xl border border-[#CEDEA4] space-y-3 mt-4">
    <h3 class="text-xs font-bold uppercase tracking-wider text-[#5A7259]">Resumen Calculado</h3>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
        <div>
            <p class="text-xs font-semibold text-[#526655]">Cuota mensual total:</p>
            <p class="text-xl sm:text-2xl font-extrabold text-[#214523] mt-0.5">
                S/ {{ monthlyQuota() | number:'1.0-0' }} <span class="text-xs font-medium text-[#526655]">/ mes</span>
            </p>
        </div>

        <div>
            <p class="text-xs font-semibold text-[#526655]">Fecha de término:</p>
            <p class="text-base sm:text-lg font-extrabold text-[#214523] mt-0.5">
                {{ endDate() }}
            </p>
        </div>
    </div>

    <div class="flex items-center gap-2 text-xs text-[#214523] font-semibold bg-[#D6E4B4] p-3 rounded-xl mt-2">
        <span class="text-base leading-none">ℹ</span>
        <span>Esta cuota representará el <strong>{{ incomePercentage() }}%</strong> de tu ingreso mensual.</span>
    </div>
</div>

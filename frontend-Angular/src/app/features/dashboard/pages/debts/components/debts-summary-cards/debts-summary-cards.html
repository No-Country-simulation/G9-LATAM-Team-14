<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5 mb-3">
    <!-- Card 1: Deuda Total Pendiente -->
    <div
        class="bg-[#EAF2CC] p-4 sm:p-5 rounded-2xl border border-[#DCE8B5] shadow-xs flex items-center justify-between">
        <div>
            <p class="text-xs sm:text-sm font-medium text-[#526655]">Deuda total pendiente</p>
            <p class="text-xl sm:text-2xl lg:text-3xl font-bold text-[#214523] mt-1.5 sm:mt-2">{{ totalPending() }}</p>
        </div>
        <div
            class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-[#D6E4B4] text-[#214523] flex items-center justify-center shrink-0">
            <app-icon-fin-coach name="debts" class="w-5 h-5 sm:w-6 sm:h-6" />
        </div>
    </div>

    <!-- Card 2: Cuota Mensual Total -->
    <div
        class="bg-[#EAF2CC] p-4 sm:p-5 rounded-2xl border border-[#DCE8B5] shadow-xs flex items-center justify-between">
        <div>
            <p class="text-xs sm:text-sm font-medium text-[#526655]">Cuota mensual total</p>
            <p class="text-xl sm:text-2xl lg:text-3xl font-bold text-[#214523] mt-1.5 sm:mt-2">{{ monthlyTotal() }}</p>
            <p class="text-xs text-[#526655] font-medium mt-1">{{ incomePercentage() }} de tu ingreso</p>
        </div>
        <div
            class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-[#D6E4B4] text-[#214523] flex items-center justify-center shrink-0">
            <app-icon-fin-coach name="calendar" class="w-5 h-5 sm:w-6 sm:h-6" />
        </div>
    </div>

    <!-- Card 3: Libre de Deudas En -->
    <div
        class="bg-[#EAF2CC] p-4 sm:p-5 rounded-2xl border border-[#DCE8B5] shadow-xs flex items-center justify-between sm:col-span-2 lg:col-span-1">
        <div>
            <p class="text-xs sm:text-sm font-medium text-[#526655]">Libre de deudas en</p>
            <p class="text-xl sm:text-2xl lg:text-3xl font-bold text-[#214523] mt-1.5 sm:mt-2">{{ freeDate() }}</p>
            <p class="text-xs text-[#526655] font-medium mt-1">faltan {{ monthsRemaining() }} meses</p>
        </div>
        <div
            class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-[#D6E4B4] text-[#214523] flex items-center justify-center shrink-0">
            <app-icon-fin-coach name="flag" class="w-5 h-5 sm:w-6 sm:h-6" />
        </div>
    </div>
</div>

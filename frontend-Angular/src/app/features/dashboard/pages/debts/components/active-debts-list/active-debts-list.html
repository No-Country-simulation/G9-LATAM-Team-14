<div class="space-y-3">
    <h2 class="text-lg sm:text-xl font-bold text-[#214523] tracking-tight mb-1">Deudas activas</h2>

    <div class="space-y-2.5">
        @for (debt of debts(); track debt.id) {
        <div class="bg-[#EAF2CC] p-3 sm:p-3.5 rounded-2xl border border-[#DCE8B5] shadow-xs space-y-2.5 hover:border-[#C8D99B] transition-all">
            <!-- Item Header Row -->
            <div class="flex items-center justify-between gap-2.5">
                <div class="flex items-center gap-2.5 min-w-0 flex-1">
                    <div
                        class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-[#FCE6D4] text-[#D96B27] flex items-center justify-center shrink-0 shadow-xs">
                        <app-icon-fin-coach [name]="debt.iconName" class="w-4 h-4 sm:w-5 sm:h-5" />
                    </div>
                    <div class="min-w-0 flex-1">
                        <h3 class="font-bold text-[#214523] text-sm sm:text-base leading-snug truncate">{{ debt.title }}</h3>
                        <p class="text-xs text-[#526655] font-medium truncate">{{ debt.subtitle }}</p>
                    </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                    <div class="text-right">
                        <p class="font-bold text-[#214523] text-xs sm:text-sm">{{ debt.monthlyPayment }}</p>
                        <p class="text-[11px] sm:text-xs text-[#526655] font-medium">{{ debt.remainingAmount }}</p>
                    </div>

                    <!-- Botones de Acción: Editar y Eliminar -->
                    <div class="flex items-center gap-1 pl-1 border-l border-[#D6E4B4]">
                        <button type="button" (click)="edit.emit(debt)"
                            class="p-1.5 text-[#526655] hover:text-[#214523] hover:bg-[#D6E4B4] rounded-lg transition cursor-pointer"
                            title="Editar deuda">
                            <app-icon-fin-coach name="edit" class="w-4 h-4" />
                        </button>
                        <button type="button" (click)="delete.emit(debt.id)"
                            class="p-1.5 text-red-600 hover:text-red-700 hover:bg-red-50 rounded-lg transition cursor-pointer"
                            title="Eliminar deuda">
                            <app-icon-fin-coach name="trash" class="w-4 h-4" />
                        </button>
                    </div>
                </div>
            </div>

            <!-- Progress Bar & Percentage Row -->
            <div class="space-y-1 pt-0.5">
                <div class="flex justify-between items-center text-[11px] sm:text-xs font-semibold text-[#526655]">
                    <span>{{ debt.progressText }}</span>
                    <span>{{ debt.percentage }}%</span>
                </div>
                <div class="w-full bg-[#D6E4B4] h-2 rounded-full overflow-hidden">
                    <div class="bg-[#5A7259] h-full rounded-full transition-all duration-500"
                        [style.width.%]="debt.percentage"></div>
                </div>
            </div>
        </div>
        }
    </div>
</div>

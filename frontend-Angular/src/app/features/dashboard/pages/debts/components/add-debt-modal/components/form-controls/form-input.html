<div class="space-y-1.5">
  @if (label()) {
    <label [for]="id()" class="block text-xs font-semibold text-[#214523]">{{ label() }}</label>
  }
  <div class="relative flex items-center">
    @if (prefix()) {
      <span class="absolute left-3.5 text-sm font-bold text-[#5B7658] select-none">{{ prefix() }}</span>
    }
    <input
      [id]="id()"
      [type]="type()"
      [min]="min()"
      [placeholder]="placeholder()"
      [ngModel]="value()"
      (ngModelChange)="value.set($event)"
      [class.pl-8]="prefix()"
      class="w-full bg-[#F4F8DE] border border-[#C6D8A2] rounded-xl px-3.5 py-2.5 text-sm font-semibold text-[#214523] placeholder-[#8BA082] focus:outline-none focus:ring-2 focus:ring-[#5A7259]"
    />
  </div>
  @if (helpText()) {
    <p class="text-[11px] text-[#526655] font-medium leading-tight">{{ helpText() }}</p>
  }
</div>

<div class="space-y-1.5">
    @if (label()) {
    <label [for]="id()" class="block text-xs font-semibold text-[#214523] select-none">{{ label() }}</label>
    }
    <div class="relative">
        @if (prefix()) {
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-sm font-bold text-[#526655] select-none">
            {{ prefix() }}
        </span>
        }
        <input [id]="id()" [type]="type()" [placeholder]="placeholder()" [min]="min()" [ngModel]="value()"
            (ngModelChange)="value.set($event)" [class.pl-9]="prefix()"
            class="w-full bg-[#F4F8DE] border border-[#C6D8A2] rounded-xl px-3.5 py-2.5 text-sm font-bold text-[#214523] focus:outline-none focus:ring-2 focus:ring-[#5A7259]" />
    </div>
    @if (helpText()) {
    <p class="text-[11px] text-[#526655] font-medium leading-tight">{{ helpText() }}</p>
    }
</div>

<div class="space-y-4">
    <h3 class="text-xs font-bold text-[#5A7259] uppercase tracking-wider">Detalles de la Deuda</h3>

    <!-- Categoría -->
    <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-[#214523]">Categoría</label>
        <select [ngModel]="category()" (ngModelChange)="category.set($event)" name="category"
            class="w-full bg-[#F4F8DE] border border-[#C6D8A2] rounded-xl px-3.5 py-2.5 text-sm font-semibold text-[#214523] focus:outline-none focus:ring-2 focus:ring-[#5A7259] cursor-pointer">
            @for (opt of categoryOptions; track opt) {
            <option [value]="opt">{{ opt }}</option>
            }
        </select>
    </div>

    <!-- Monto total a pagar -->
    <app-form-input label="Monto total a pagar" id="totalAmountInput" type="number" prefix="S/" placeholder="6,000"
        helpText="Ingresa el monto total final acordado (incluyendo intereses o montos extra si aplican)."
        [(value)]="totalAmount">
    </app-form-input>

    <!-- ¿Cómo vas a pagar? (Interruptor / Toggle) -->
    <div class="space-y-2.5 pt-2 border-t border-[#DCE8B5]/60">
        <label class="block text-xs font-semibold text-[#214523]">¿Cómo vas a pagar?</label>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-[#F4F8DE] p-1.5 rounded-xl border border-[#C6D8A2]">
            <!-- Opción A1: Plazo Fijo -->
            <button type="button" (click)="paymentMode.set('fixed_term')"
                class="py-2 px-3 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center justify-center gap-1.5"
                [ngClass]="paymentMode() === 'fixed_term' ? 'bg-[#5A7259] text-white shadow-xs' : 'text-[#526655] hover:text-[#214523]'">
                <span>Plazo Fijo (Bancos)</span>
            </button>

            <!-- Opción A2: Pago Libre / A mi ritmo -->
            <button type="button" (click)="paymentMode.set('free_payment')"
                class="py-2 px-3 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center justify-center gap-1.5"
                [ngClass]="paymentMode() === 'free_payment' ? 'bg-[#5A7259] text-white shadow-xs' : 'text-[#526655] hover:text-[#214523]'">
                <span>Pago Libre / A mi ritmo</span>
            </button>
        </div>

        <!-- Campos según modalidad -->
        @if (paymentMode() === 'fixed_term') {
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
            <app-form-input label="Plazo en meses" id="fixedTermMonthsInput" type="number" min="1" placeholder="12"
                [(value)]="fixedTermMonths">
            </app-form-input>

            <app-month-picker-input label="Fecha de inicio" id="startDateFixedInput" [(value)]="startDate">
            </app-month-picker-input>
        </div>
        } @else {
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
            <app-form-input label="Cuota mensual que puedes/planeas pagar" id="freePaymentQuotaInput" type="number"
                prefix="S/" min="1" placeholder="150" [(value)]="freePaymentMonthlyQuota">
            </app-form-input>

            <app-month-picker-input label="Fecha de inicio" id="startDateFreeInput" [(value)]="startDate">
            </app-month-picker-input>
        </div>
        }
    </div>
</div>

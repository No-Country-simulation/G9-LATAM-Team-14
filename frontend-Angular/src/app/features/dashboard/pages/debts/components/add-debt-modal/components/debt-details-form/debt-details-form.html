<div class="space-y-4 mt-3">
    <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-[#214523]">Tipo de crédito</label>
        <select [ngModel]="category()" (ngModelChange)="category.set($event)" name="category"
            class="w-full bg-[#F4F8DE] border border-[#C6D8A2] rounded-xl px-3.5 py-2.5 text-sm font-semibold text-[#214523] focus:outline-none focus:ring-2 focus:ring-[#5A7259] cursor-pointer">
            @for (opt of categoryOptions; track opt) {
            <option [value]="opt">{{ opt }}</option>
            }
        </select>
    </div>
    <app-form-input label="Monto total a pagar" id="totalAmountInput" type="number" prefix="$" placeholder="6,000"
        helpText="Ingresa el monto total final acordado (incluyendo intereses o montos extra si aplican)."
        [(value)]="totalAmount">
    </app-form-input>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <app-form-input label="Plazo en meses" id="fixedTermMonthsInput" type="number" min="1" placeholder="12"
            [(value)]="fixedTermMonths">
        </app-form-input>

        <app-form-input label="Fecha de inicio" id="startDateInput" type="date" [(value)]="startDate">
        </app-form-input>
    </div>
</div>

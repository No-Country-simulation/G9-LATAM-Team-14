<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-7xl mx-auto">
    <header class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold text-gray-800">Fincoach Admin Dashboard</h1>
        <p class="text-gray-500 mt-1">
          Bienvenido
          @if (currentUser()) {
            <span class="font-semibold text-[#5A7259]">{{ currentUser()?.email }}</span>
          }
        </p>
      </div>
      <button 
        (click)="onLogout()" 
        type="button" 
        class="bg-red-500 hover:bg-red-600 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition-colors flex items-center justify-center gap-2 cursor-pointer self-start md:self-auto shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    </header>
  </div>
</div>

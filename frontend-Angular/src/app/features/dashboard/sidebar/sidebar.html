@if (uiService.isSidebarOpen()) {
<div (click)="uiService.closeSidebar()"
    class="fixed inset-0 bg-black/30 backdrop-blur-xs z-40 md:hidden transition-opacity"></div>
}

<aside [class.-translate-x-full]="!uiService.isSidebarOpen()"
    class="fixed md:static inset-y-0 left-0 z-50 w-68 md:w-65 lg:w-75 h-screen bg-[#f6fbdd] text-[#2d4231] flex flex-col justify-between select-none shadow-xl md:shadow-none transition-transform duration-300 ease-in-out md:translate-x-0 border-r border-[#e2ebbe]">
    <div class="flex flex-col gap-6">
        <div class="flex items-center justify-between px-4 pt-5">
            <div class="flex items-center gap-2">
                <img src="/images/logo.webp" alt="Logo" class="w-10 h-10 object-contain">
                <span class="text-2xl font-semibold text-[#2d4231]">Fincoach</span>
            </div>

            <button (click)="uiService.closeSidebar()"
                class="md:hidden text-[#2d4231] hover:bg-[#ebf3cb] p-2 rounded-full transition-colors cursor-pointer">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <nav class="flex flex-col gap-1 pl-3">
            @for (item of menuItems; track item.label) {
            <a [routerLink]="item.route"
                routerLinkActive="bg-[#e3ebd3] font-semibold border-r-4 border-[#2d4231] text-[#1e3122]"
                [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }" (click)="uiService.closeSidebar()"
                class="flex items-center gap-3 px-3 py-2 rounded-l-lg text-sm font-medium text-[#384e3c] hover:bg-[#ebf3cb] transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" [innerHTML]="item.iconSvg">
                </svg>
                <span>{{ item.label }}</span>
            </a>
            }
        </nav>
    </div>

    <div class="p-4 flex flex-col gap-3">
        <div class="px-1 text-xs text-[#526655] leading-relaxed">
            Tu plataforma para gestionar deudas, presupuestos y objetivos de ahorro.
        </div>

        <hr class="border-[#e2ebbe] my-1" />

        <button [routerLink]="'/dashboard/settings'" (click)="uiService.closeSidebar()"
            class="flex items-center justify-center gap-2 w-full py-2 px-4 rounded-xl border border-[#c3d3a0] bg-transparent text-sm font-medium text-[#2d4231] hover:bg-[#ebf3cb] active:scale-[0.98] transition-all cursor-pointer">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                <circle cx="12" cy="12" r="3" />
            </svg>
            <span>Configuración</span>
        </button>

        <button (click)="logout()"
            class="flex items-center justify-center gap-2 w-full py-2 px-4 rounded-xl border border-[#c3d3a0] bg-transparent text-sm font-medium text-[#2d4231] hover:bg-[#ebf3cb] hover:text-red-800 active:scale-[0.98] transition-all cursor-pointer">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 12h11" />
                <path d="m17 16 4-4-4-4" />
                <path d="M21 6.344V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1.344" />
            </svg>
            <span>Cerrar sesión</span>
        </button>
    </div>
</aside>

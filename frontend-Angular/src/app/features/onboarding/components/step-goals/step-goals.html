<div class="flex flex-col items-center text-center max-w-2xl mx-auto w-full py-4">
    <h1 class="text-2xl sm:text-4xl font-extrabold text-[#214523] tracking-tight">
        ¿Cuál es tu próximo gran objetivo?
    </h1>
    <p class="text-xs sm:text-sm text-[#4E6750] mt-2">
        Te ayudaremos a crear un plan de ahorro automático para alcanzarlo.
    </p>
    <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 sm:gap-4 w-full mt-8">
        @for (goal of goals; track goal.id) {
        <button type="button" (click)="selectGoal(goal.id)" [class.bg-[#D7E3A9]]="selectedGoal() === goal.id"
            [class.border-[#3E5741]]="selectedGoal() === goal.id" [class.ring-2]="selectedGoal() === goal.id"
            [class.ring-[#3E5741]/30]="selectedGoal() === goal.id" [class.bg-[#EAEFC8]/80]="selectedGoal() !== goal.id"
            [class.border-[#C9DAA7]]="selectedGoal() !== goal.id"
            class="flex flex-col items-center justify-center p-5 sm:p-6 rounded-2xl border transition-all duration-200 hover:border-[#4A634E] hover:bg-[#E3EAA5] cursor-pointer shadow-xs gap-3 text-center group min-h-[120px]">
            <div [class.bg-[#C2D68C]]="selectedGoal() === goal.id" [class.bg-[#D6E3AA]]="selectedGoal() !== goal.id"
                class="p-2.5 rounded-xl transition-colors">
                <app-icon-fin-coach [name]="goal.icon" class="w-6 h-6 text-[#214523]" />
            </div>
            <span class="text-xs sm:text-sm font-semibold text-[#214523] leading-snug">{{ goal.title }}</span>
        </button>
        }
    </div>
</div>

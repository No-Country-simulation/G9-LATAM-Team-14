<div class="flex flex-col items-center text-center max-w-xl mx-auto w-full py-2">
    <!-- Títulos -->
    <h1 class="text-2xl sm:text-4xl font-extrabold text-[#214523] tracking-tight">
        ¡Comencemos a registrar!
    </h1>
    <p class="text-xs sm:text-sm text-[#4E6750] mt-1.5">
        Ingresa tus 3 gastos más recientes para personalizar tus primeras gráficas
    </p>
    <div class="w-full flex flex-col gap-1.5 mt-6">
        <div
            class="w-full flex items-center justify-between px-1 text-left text-[11px] sm:text-xs font-semibold text-[#214523] mb-1">
            <div class="flex-1 pl-5">Descripción</div>
            <div class="w-24 sm:w-36 pr-6">Monto</div>
        </div>
        @for (expense of expenses(); track expense.id; let i = $index) {
        <div class="w-full flex items-center gap-1.5 sm:gap-3 py-1">
            <span class="w-4 text-center text-xs font-bold text-[#214523] shrink-0">{{ i + 1 }}.</span>
            <div class="flex-1 min-w-0">
                <input type="text" [(ngModel)]="expense.description" placeholder="Ej: Café, Supermercado..."
                    class="w-full py-2 px-2 sm:px-3 bg-[#EAEFC8]/80 border border-[#C9DAA7] rounded-xl text-[11px] sm:text-sm text-[#214523] focus:outline-none focus:border-[#4A634E] placeholder-[#6E8870] font-medium truncate" />
            </div>
            <div class="w-24 sm:w-36 relative flex items-center shrink-0">
                <span class="absolute left-2 text-[#4A634E] font-semibold text-xs">$</span>
                <input type="number" [(ngModel)]="expense.amount" placeholder="0.00"
                    class="w-full pl-5 pr-2 py-2 bg-[#EAEFC8]/80 border border-[#C9DAA7] rounded-xl text-[11px] sm:text-sm text-[#214523] focus:outline-none focus:border-[#4A634E] placeholder-[#6E8870] font-medium" />
            </div>
            <button type="button" (click)="removeExpense(expense.id)"
                class="p-1 text-[#5A7259] hover:text-red-600 hover:bg-red-100/60 rounded-lg transition-colors cursor-pointer shrink-0"
                title="Eliminar gasto">
                <app-icon-fin-coach name="trash" class="w-4 h-4 sm:w-5 sm:h-5" />
            </button>
        </div>
        }
        <button type="button" (click)="addExpense()"
            class="w-full border border-dashed border-[#A8C4A6] hover:border-[#4A634E] text-[#214523] bg-[#E5ECBF]/30 hover:bg-[#E5ECBF]/70 py-2.5 rounded-xl font-semibold transition-all duration-200 flex items-center justify-center gap-2 text-xs sm:text-sm cursor-pointer mt-2">
            <app-icon-fin-coach name="plus" class="w-4 h-4" />
            Añadir gasto
        </button>
    </div>
</div>

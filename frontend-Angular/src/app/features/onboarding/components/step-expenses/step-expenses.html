<div class="flex flex-col items-center max-w-xl mx-auto w-full py-2 text-left">
    <!-- Encabezado del formulario -->
    <div class="text-center w-full mb-4">
        <h1 class="text-2xl sm:text-4xl font-extrabold text-[#214523] tracking-tight">
            Nuevo movimiento
        </h1>
        <p class="text-xs sm:text-sm text-[#4E6750] mt-1.5">
            Intenta registrar tu primer movimiento para ver cómo el modelo de IA te ayuda a clasificarlo
            automáticamente.
        </p>
    </div>

    <!-- Formulario de movimiento -->
    <form (submit)="$event.preventDefault()" class="w-full flex flex-col gap-4 mt-2">
        <!-- Fila 1: Fecha y Hora -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="flex flex-col gap-1.5">
                <label for="movementDate" class="text-xs sm:text-sm font-semibold text-[#214523]">
                    Fecha
                </label>
                <div class="relative flex items-center w-full">
                    <input id="movementDate" type="date" [(ngModel)]="date" name="date"
                        class="w-full py-3 px-3.5 bg-[#EAEFC8]/80 border border-[#C9DAA7] rounded-2xl text-xs sm:text-sm text-[#214523] focus:outline-none focus:border-[#4A634E] font-medium shadow-xs" />
                </div>
            </div>
            <div class="flex flex-col gap-1.5">
                <label for="movementTime" class="text-xs sm:text-sm font-semibold text-[#214523]">
                    Hora
                </label>
                <div class="relative flex items-center w-full">
                    <input id="movementTime" type="time" [(ngModel)]="time" name="time"
                        class="w-full py-3 px-3.5 bg-[#EAEFC8]/80 border border-[#C9DAA7] rounded-2xl text-xs sm:text-sm text-[#214523] focus:outline-none focus:border-[#4A634E] font-medium shadow-xs" />
                </div>
            </div>
        </div>

        <!-- Fila 2: Botón de Ingreso / Botón de Gasto con Iconos -->
        <div class="flex flex-col gap-1.5">
            <label class="text-xs sm:text-sm font-semibold text-[#214523]">
                Tipo de movimiento
            </label>
            <div class="grid grid-cols-2 gap-3.5 w-full">
                <button type="button" (click)="type = 'INGRESO'" [class.bg-[#D7E3A9]]="type === 'INGRESO'"
                    [class.border-[#3E5741]]="type === 'INGRESO'" [class.ring-2]="type === 'INGRESO'"
                    [class.ring-[#3E5741]/30]="type === 'INGRESO'" [class.bg-[#EAEFC8]/80]="type !== 'INGRESO'"
                    [class.border-[#C9DAA7]]="type !== 'INGRESO'"
                    class="flex items-center justify-center gap-2 py-3 px-4 rounded-2xl border text-xs sm:text-sm font-bold text-[#214523] transition-all duration-200 hover:bg-[#E3EAA5] hover:border-[#4A634E] cursor-pointer shadow-xs">
                    <app-icon-fin-coach name="arrow-up" class="w-4 h-4 text-[#214523]" />
                    <span>Ingreso</span>
                </button>

                <button type="button" (click)="type = 'EGRESO'" [class.bg-[#D7E3A9]]="type === 'EGRESO'"
                    [class.border-[#3E5741]]="type === 'EGRESO'" [class.ring-2]="type === 'EGRESO'"
                    [class.ring-[#3E5741]/30]="type === 'EGRESO'" [class.bg-[#EAEFC8]/80]="type !== 'EGRESO'"
                    [class.border-[#C9DAA7]]="type !== 'EGRESO'"
                    class="flex items-center justify-center gap-2 py-3 px-4 rounded-2xl border text-xs sm:text-sm font-bold text-[#214523] transition-all duration-200 hover:bg-[#E3EAA5] hover:border-[#4A634E] cursor-pointer shadow-xs">
                    <app-icon-fin-coach name="arrow-down" class="w-4 h-4 text-[#214523]" />
                    <span>Gasto</span>
                </button>
            </div>
        </div>

        <!-- Fila 3: Título o descripción del movimiento -->
        <div class="flex flex-col gap-1.5">
            <label for="movementDescription" class="text-xs sm:text-sm font-semibold text-[#214523]">
                Título o descripción del movimiento
            </label>
            <input id="movementDescription" type="text" [(ngModel)]="description" name="description"
                placeholder="Ejemplo: comprar helado"
                class="w-full py-3 px-4 bg-[#EAEFC8]/80 border border-[#C9DAA7] rounded-2xl text-xs sm:text-sm text-[#214523] focus:outline-none focus:border-[#4A634E] placeholder-[#6E8870] font-medium shadow-xs" />
        </div>

        <!-- Fila 4: Valor -->
        <div class="flex flex-col gap-1.5">
            <label for="movementAmount" class="text-xs sm:text-sm font-semibold text-[#214523]">
                Valor
            </label>
            <div class="relative flex items-center w-full">
                <span class="absolute left-4 text-[#4A634E] font-semibold text-xs sm:text-sm">$</span>
                <input id="movementAmount" type="number" [(ngModel)]="amount" name="amount" placeholder="0.00"
                    class="w-full pl-9 pr-4 py-3 bg-[#EAEFC8]/80 border border-[#C9DAA7] rounded-2xl text-xs sm:text-sm text-[#214523] focus:outline-none focus:border-[#4A634E] placeholder-[#6E8870] font-medium shadow-xs" />
            </div>
        </div>

        <!-- Fila 5: Nota o contexto -->
        <div class="flex flex-col gap-1.5">
            <label for="movementNote" class="text-xs sm:text-sm font-semibold text-[#214523]">
                Nota o contexto
            </label>
            <textarea id="movementNote" rows="2" [(ngModel)]="note" name="note"
                placeholder="Ejemplo: salida del fin de semana con amigos"
                class="w-full py-3 px-4 bg-[#EAEFC8]/80 border border-[#C9DAA7] rounded-2xl text-xs sm:text-sm text-[#214523] focus:outline-none focus:border-[#4A634E] placeholder-[#6E8870] font-medium shadow-xs resize-none"></textarea>
        </div>
    </form>
</div>

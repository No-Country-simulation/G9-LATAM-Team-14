<div class="flex flex-col items-center justify-center min-h-screen bg-[#F6FAD4] px-3 sm:px-6 py-8">
    <app-auth-header title="Bienvenido de nuevo" />
    <form (ngSubmit)="onLogin()" class="w-full sm:max-w-sm flex flex-col gap-3">
        <app-auth-input id="email" label="Correo electrónico" type="email" icon="mail" placeholder="tu@ejemplo.com"
            [(value)]="email" [required]="true" />
        <app-auth-input id="password" label="Contraseña" [isPassword]="true" icon="lock" placeholder="••••••••"
            [(value)]="password" [required]="true" linkText="¿Olvidaste tu contraseña?" linkUrl="#" />
        <button type="submit"
            class="w-full bg-[#5A7259] text-white py-2.5 sm:py-3 px-4 rounded-xl font-medium shadow-sm hover:bg-[#465A45] transition-colors flex items-center justify-center gap-2 mt-2 text-sm sm:text-base cursor-pointer">
            Iniciar sesión
            <app-icon-fin-coach name="arrow-right" class="w-4 h-4" />
        </button>
    </form>
    <div class="w-full sm:max-w-sm flex items-center my-5 md:my-6">
        <div class="flex-grow border-t border-[#E1E6C2]"></div>
        <span class="mx-4 text-xs text-gray-400 font-light">o</span>
        <div class="flex-grow border-t border-[#E1E6C2]"></div>
    </div>
    <app-google-button class="w-full sm:max-w-sm" />
    <p class="text-xs sm:text-sm text-gray-600 mt-6 md:mt-8 text-center">
        ¿No tienes una cuenta?
        <a routerLink="/registro"
            class="text-[#214523] font-semibold hover:underline block sm:inline mt-1 sm:mt-0">Regístrate gratis</a>
    </p>
</div>

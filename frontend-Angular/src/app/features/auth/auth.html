<div class="flex flex-col items-center justify-center min-h-screen bg-[#F6FAD4] px-4 sm:px-6 py-8 md:py-12">
    <!-- header -->
    <div class="flex flex-col items-center mb-6 md:mb-8 text-center">
        <div class="flex gap-2 items-center justify-center">
            <img src="images/logo.webp" alt="Fincoach Logo" class="w-8 h-8 object-contain">
            <span class="text-base sm:text-lg font-semibold text-[#5A7259]">Fincoach</span>
        </div>
        <h2 class="text-2xl sm:text-3xl font-medium text-[#214523] mt-3">Bienvenido de nuevo</h2>
        <p class="text-xs sm:text-sm text-gray-600 mt-1 px-4">Cultiva tu futuro financiero.</p>
    </div>

    <!-- form -->
    <form (ngSubmit)="onLogin()" class="w-full max-w-[90%] sm:max-w-sm flex flex-col gap-4 sm:gap-5">
        <!-- correo -->
        <div class="flex flex-col gap-1.5">
            <label for="email" class="text-xs sm:text-sm font-medium text-[#214523]">Correo electrónico</label>
            <div class="relative flex items-center">
                <span class="absolute left-4 text-gray-400 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-mail">
                        <rect width="20" height="16" x="2" y="4" rx="2" />
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                    </svg>
                </span>
                <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="tu@ejemplo.com" required
                    class="w-full pl-11 pr-4 py-2.5 sm:py-3 bg-[#FAFDED] border border-[#E1E6C2] rounded-xl text-sm focus:outline-none focus:border-[#5A7259] text-gray-700 placeholder-gray-300 shadow-sm appearance-none" />
            </div>
        </div>

        <!-- password -->
        <div class="flex flex-col gap-1.5">
            <div class="flex justify-between items-center">
                <label for="password" class="text-xs sm:text-sm font-medium text-[#214523]">Contraseña</label>
                <a href="#" class="text-[11px] sm:text-xs text-gray-500 hover:underline">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="relative flex items-center">
                <span class="absolute left-4 text-gray-400 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-lock">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                </span>
                <input id="password" name="password" [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" required
                    class="w-full pl-11 pr-11 py-2.5 sm:py-3 bg-[#FAFDED] border border-[#E1E6C2] rounded-xl text-sm focus:outline-none focus:border-[#5A7259] text-gray-700 placeholder-gray-300 shadow-sm appearance-none" />
                <button type="button" (click)="togglePasswordVisibility()"
                    class="absolute right-4 text-gray-400 hover:text-[#5A7259] focus:outline-none flex items-center p-1">
                    @if (showPassword) {
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-eye-off">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                        <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                        <line x1="2" x2="22" y1="2" y2="22" />
                    </svg>
                    } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-eye">
                        <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    }
                </button>
            </div>
        </div>

        <!-- Botón de Submit -->
        <button type="submit"
            class="w-full bg-[#5A7259] text-white py-2.5 sm:py-3 px-4 rounded-xl font-medium shadow-sm hover:bg-[#465A45] transition-colors flex items-center justify-center gap-2 mt-2 text-sm sm:text-base cursor-pointer">
            Iniciar sesión
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-arrow-right">
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
            </svg>
        </button>
    </form>

    <!-- separador -->
    <div class="w-full max-w-[90%] sm:max-w-sm flex items-center my-5 md:my-6">
        <div class="flex-grow border-t border-[#E1E6C2]"></div>
        <span class="mx-4 text-xs text-gray-400 font-light">o</span>
        <div class="flex-grow border-t border-[#E1E6C2]"></div>
    </div>

    <!-- google -->
    <button type="button"
        class="w-full max-w-[90%] sm:max-w-sm bg-[#ECF2CB] text-gray-700 border border-[#D5DCAC] py-2.5 sm:py-3 px-4 rounded-xl font-medium shadow-sm hover:bg-[#E2E9BA] transition-colors flex items-center justify-center gap-3 text-sm sm:text-base">
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05" />
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
        </svg>
        Continuar con Google
    </button>

    <p class="text-xs sm:text-sm text-gray-600 mt-6 md:mt-8 text-center">
        ¿No tienes una cuenta?
        <a href="#" class="text-[#214523] font-semibold hover:underline block sm:inline mt-1 sm:mt-0">Regístrate gratis</a>
    </p>
</div>
